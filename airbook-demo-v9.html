<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Airbook</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#7BBFFE;font-family:Arial,sans-serif}
  h1{position:fixed;left:38px;top:28px;margin:0;font-size:58px;line-height:1;font-weight:500;letter-spacing:-0.06em;color:#111;z-index:6;pointer-events:none}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:default}
  #shadow{position:fixed;left:50%;top:76%;width:min(32vw,420px);height:56px;border-radius:50%;background:rgba(18,43,74,.28);filter:blur(22px);transform:translate(-50%,-50%);pointer-events:none;z-index:1}
  #ui{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);display:flex;gap:14px;z-index:10}
  .dot{width:40px;height:40px;border:none;border-radius:50%;background:rgba(255,255,255,.78);color:#111;font-size:16px;font-weight:600;box-shadow:0 10px 22px rgba(0,0,0,.14);cursor:pointer;transition:.18s ease}
  .dot:hover{transform:translateY(-2px);background:rgba(255,255,255,.92)}
  .dot.active{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.32),0 12px 28px rgba(0,0,0,.18);transform:translateY(-1px) scale(1.05)}
  @media (max-width: 720px){h1{left:20px;top:20px;font-size:44px}#ui{gap:10px;bottom:18px}.dot{width:34px;height:34px;font-size:14px}}
</style>
</head>
<body>
<h1>Airbook</h1>
<div id="shadow"></div>
<div id="ui" aria-label="scenario buttons">
  <button class="dot active" data-stage="1">1</button>
  <button class="dot" data-stage="2">2</button>
  <button class="dot" data-stage="3">3</button>
  <button class="dot" data-stage="4">4</button>
  <button class="dot" data-stage="5">5</button>
</div>
<canvas></canvas>
<script>
const canvas=document.querySelector('canvas');
const shadow=document.getElementById('shadow');
const buttons=[...document.querySelectorAll('.dot')];
const gl=canvas.getContext('webgl',{alpha:true,antialias:true});
if(!gl){alert('WebGL을 지원하는 브라우저가 필요합니다.');throw new Error('WebGL required');}

const vs=`
attribute vec2 uv; attribute float side;
uniform float inflate,t,press,alphaBias,thickness;
uniform vec2 hit;
uniform mat4 m;
uniform sampler2D book; uniform float lineMix;
varying vec3 P,N; varying vec2 U; varying float A; varying float face;
vec3 surf(vec2 q,float s){
  q=clamp(q,vec2(-1.),vec2(1.)); float x=q.x,y=q.y;
  float core=max(0.,(1.-x*x)*(1.-y*y));
  float puff=pow(core,.36);
  float chamberA=exp(-pow(abs((x+0.55)*2.2),2.));
  float chamberB=exp(-pow(abs((x-0.0)*2.0),2.));
  float chamberC=exp(-pow(abs((x-0.55)*2.2),2.));
  float chamber=(.92+.16*(chamberA+chamberB+chamberC));
  float edge=pow(1.-sqrt(core),3.2);
  float ridge=.009*sin(28.*x)*(1.-abs(y))*inflate;
  float wrinkle=.008*sin(45.*x+6.*y)*edge + .006*sin(55.*y+4.*x)*edge;
  float d=length((q-hit)*vec2(1.,1.));
  float dent=press*(.52*exp(-d*d/.026)-.08*exp(-pow(abs((d-.25)/.08),2.)))*puff;
  float body=(thickness + inflate*(1.05*puff*chamber + ridge + wrinkle))*smoothstep(0.,.025,core);
  float z=s*(.003 + body);
  if(s>0.) {
    z -= dent;
    float h=texture2D(book,vec2((x+1.)*.5,(1.-y)*.5)).a;
    z += .038*h*lineMix*(1.+.7*press*exp(-d*d/.08));
  } else z -= dent*.1;
  return vec3(x*1.55*(1.-.08*inflate*(1.-y*y)), y*1.08*(1.-.08*inflate*(1.-x*x)), z);
}
void main(){
  vec2 q=uv;
  P=surf(q,side);
  vec3 dx=surf(q+vec2(.002,0.),side)-surf(q-vec2(.002,0.),side);
  vec3 dy=surf(q+vec2(0.,.002),side)-surf(q-vec2(0.,.002),side);
  N=normalize(cross(dx,dy))*side;
  U=q; A=alphaBias; face=side;
  gl_Position=m*vec4(P,1.);
}`;

const fs=`
precision highp float;
varying vec3 P,N; varying vec2 U; varying float A; varying float face;
uniform vec3 eye; uniform float lineMix; uniform float ghost; uniform sampler2D book; uniform vec2 hit; uniform float press;
void main(){
  vec2 uv=vec2((U.x+1.)*.5,(1.-U.y)*.5);
  float h=texture2D(book,uv).a*lineMix*step(0.,face);
  float dx=(texture2D(book,uv+vec2(.002,0.)).a-texture2D(book,uv-vec2(.002,0.)).a)*lineMix*step(0.,face);
  float dy=(texture2D(book,uv-vec2(0.,.002)).a-texture2D(book,uv+vec2(0.,.002)).a)*lineMix*step(0.,face);
  float boost=1.+.8*press*exp(-dot(U-hit,U-hit)/.08);
  vec3 n=normalize(normalize(N)+vec3(-dx*2.5,-dy*3.5,0.)*boost), v=normalize(eye-P), r=reflect(-v,n);
  float fres=pow(1.-abs(dot(n,v)),3.2);
  float l1=max(0.,dot(n,normalize(vec3(-.45,.75,1.))));
  float l2=max(0.,dot(n,normalize(vec3(.65,-.15,1.))));
  vec3 col=mix(vec3(.74,.83,.90),vec3(.98,.995,1.),l1*.8+.08);
  col+=vec3(.12,.15,.18)*l2*.12;
  float hi1=exp(-pow(abs((r.x+.22)/.12),2.))*exp(-pow(abs((r.y-.52)/.55),2.));
  float hi2=exp(-pow(abs((r.x-.35)/.18),2.))*exp(-pow(abs((r.y+.1)/.22),2.))*.8;
  float hi3=exp(-pow(abs((r.y+.22+r.x*.26)/.08),2.))*.55;
  col += vec3(hi1*0.55 + hi2*0.38 + hi3*0.24);
  col = mix(col, vec3(1.), fres*.72);

  float seam=smoothstep(.94,.996,max(abs(U.x),abs(U.y)));
  col = mix(col, vec3(.93,.97,1.0), seam*.48);

  float reliefEdge=clamp(length(vec2(dx,dy))*2.8,0.,1.);
  float lightEdge=clamp((-dx+dy)*2.5,0.,1.);
  float darkEdge=clamp((dx-dy)*2.1,0.,1.);
  col=mix(col,vec3(.93,.98,1.),h*.72);
  col=mix(col,vec3(1.),lightEdge*.95);
  col=mix(col,vec3(.20,.36,.49),darkEdge*.83);
  float alpha=(.095+fres*.48+(hi1+hi2)*.38+ghost*.035+seam*.22+h*.49+reliefEdge*.85)*A;
  gl_FragColor=vec4(col,clamp(alpha,0.,.95));
}`;

function compile(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
const pr=gl.createProgram();
gl.attachShader(pr,compile(gl.VERTEX_SHADER,gl.getParameter(gl.MAX_VERTEX_TEXTURE_IMAGE_UNITS)>0?vs:vs.replace('texture2D(book,vec2((x+1.)*.5,(1.-y)*.5)).a','0.')));
gl.attachShader(pr,compile(gl.FRAGMENT_SHADER,fs));
gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(pr));
gl.useProgram(pr);

const GRID=170, verts=[], idx=[];
for(const s of [1,-1]){
  const base=verts.length/3;
  for(let j=0;j<=GRID;j++)for(let i=0;i<=GRID;i++)verts.push(i/GRID*2-1,j/GRID*2-1,s);
  for(let j=0;j<GRID;j++)for(let i=0;i<GRID;i++){
    const a=base+j*(GRID+1)+i,b=a+1,d=a+GRID+1,e=d+1;
    idx.push(a,b,d,b,e,d);
  }
}
const vbo=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,vbo); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(verts),gl.STATIC_DRAW);
for(const [name,n,off] of [['uv',2,0],['side',1,8]]){const loc=gl.getAttribLocation(pr,name);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,n,gl.FLOAT,false,12,off);} 
const ibo=gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ibo); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(idx),gl.STATIC_DRAW);
const U={};
for(const k of ['inflate','t','press','hit','m','eye','alphaBias','lineMix','thickness','ghost','book'])U[k]=gl.getUniformLocation(pr,k);

const books=[];
function makeBook(title,latin,lines,flowerColor){
 const cv=document.createElement('canvas');cv.width=1024;cv.height=1024;const g=cv.getContext('2d');
 g.fillStyle='#17344a';g.font='bold 29px Arial';g.fillText('BOTANICAL ATLAS',112,180);
 g.font='bold 72px Arial';g.fillText(title,110,278);g.font='italic 35px Arial';g.fillText(latin,112,330);
 g.strokeStyle='#345c6c';g.lineWidth=2;g.beginPath();g.moveTo(112,360);g.lineTo(910,360);g.stroke();
 g.font='500 36px Arial';lines.forEach((line,i)=>g.fillText(line,112,435+i*54));
 g.save();g.translate(743,545);g.strokeStyle='#345a40';g.lineWidth=8;g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(-20,95,10,225);g.stroke();
 for(let i=0;i<2;i++){g.save();g.translate(-4,90+i*60);g.rotate(i?-.65:.65);g.strokeStyle='#fff';g.lineWidth=9;g.beginPath();g.ellipse(i?40:-40,0,56,18,0,0,Math.PI*2);g.stroke();g.restore();}
 for(let i=0;i<8;i++){g.save();g.rotate(i*Math.PI/4);g.strokeStyle='#fff';g.lineWidth=9;g.beginPath();g.ellipse(0,-49,25,51,0,0,Math.PI*2);g.stroke();g.restore();}
 g.strokeStyle='#fff';g.lineWidth=9;g.beginPath();g.arc(0,0,25,0,Math.PI*2);g.stroke();g.restore();

 const height=document.createElement('canvas');height.width=height.height=1024;const hg=height.getContext('2d');hg.filter='blur(1px)';hg.drawImage(cv,0,0);hg.filter='none';
 const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,height);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);return tex;
}
books.push(makeBook('Daisy','Bellis perennis',['A small flower with','a bright yellow centre','and delicate white petals.','Its leaves grow close','to the ground.'],'#f4f6ef'));
books.push(makeBook('Aster','Aster amellus',['Star-shaped blossoms','open in late summer.','Their slender petals','surround a golden centre.'],'#a8a8d7'));
books.push(makeBook('Cosmos','Cosmos bipinnatus',['Light, feathery leaves','and open blossoms','move gently in the wind.','Each flower follows','the rhythm of the season.'],'#edb6c5'));
books.push(makeBook('Marigold','Calendula officinalis',['Golden petals gather','around a warm centre.','The flower opens','toward the daylight.'],'#edbd64'));
let transitionKind=0, previousCycle=0;
gl.enable(gl.BLEND); gl.blendFuncSeparate(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA,gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
gl.enable(gl.DEPTH_TEST);

function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;gl.viewport(0,0,canvas.width,canvas.height);} addEventListener('resize',resize); resize();

const pages=Array.from({length:5},()=>({x:0,y:0,angle:-0.26,tilt:0.72,scale:0.42,inflate:0.0,alpha:0.0,lines:0.0,thickness:0.005,ghost:0.0}));
let stage=1, stageStart=performance.now(), focus=0;
let press=0,pressTarget=0,vel=0,pointerDown=false;
let hit=[0.14,0.1];
let activeRect={x:innerWidth/2,y:innerHeight/2,w:280,h:200};

function selectStage(n){stage=n;stageStart=performance.now();focus=0;transitionKind=0;previousCycle=0;buttons.forEach(b=>{b.classList.toggle('active',+b.dataset.stage===n);b.setAttribute('aria-pressed',String(+b.dataset.stage===n));});pressTarget=0;pointerDown=false;}
const names=['Standby','Activate','Tactile Reading','Page Transition','Collapse & Return'];
buttons.forEach((btn,i)=>{btn.setAttribute('aria-label',names[i]);btn.addEventListener('click',()=>selectStage(i+1));});
function lerp(a,b,t){return a+(b-a)*t;}
function ease(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x);}
function targetPages(time){
 const a=(time-stageStart)/1000, bob=.018*Math.sin(time*.0018);
 const thin={x:0,y:-.30,angle:-.26,tilt:.73,scale:.38,inflate:.01,alpha:.66,lines:0,thickness:.004,ghost:0};
 const hidden={...thin,alpha:0};
 const live={...thin,y:.10+bob,angle:-.16,tilt:.67,scale:.60,inflate:1,alpha:.94,lines:1,thickness:.016};
 const out=[{...thin},...Array.from({length:4},()=>({...hidden}))];
 if(stage===1||stage===5)return out;
 if(stage===2){let f=ease(a/1.8);out[0]={...live, y:lerp(thin.y,live.y,f),inflate:f,scale:lerp(thin.scale,live.scale,f),lines:0};return out;}
 if(stage===3){out[0]={...live,lines:ease(a/.8)};return out;}
 const cycle=Math.min(2,Math.floor(a/3.5)); transitionKind=cycle;
 const local=a-cycle*3.5;
 // Each transition begins with a single reading page and an emerging layer.
 const w=ease((local-.65)/1.65), appear=ease(local/.8), pulse=Math.sin(Math.PI*w);
 const side=Math.min(.48,.55*innerHeight/innerWidth);
 const old={...live}, next={...live,alpha:0,inflate:.05,lines:0};
 if(cycle===0){ // gaze: attention moves to end of the text; next page comes forward
   const g=focus||ease((local-.15)/.65);
   old.x=-side*w;old.scale=.60-.19*w;old.inflate=1-.92*w;old.alpha=1-.78*w;old.lines=1-w*.8;
   old.ghost=.15*g;
   Object.assign(next,{x:side*(1-w),y:.10+bob,scale:.38+.22*w,inflate:.08+.92*w,alpha:appear*(.34+.60*w),lines:w});
 }else if(cycle===1){ // breath: a pressure wave lifts and expands the next layer
   const gust=Math.sin(Math.PI*ease(local/2.3));
   old.x=-side*w*.65;old.y=.1+bob-.14*gust;old.inflate=1-.9*w;old.alpha=1-.78*w;old.scale=.60-.19*w;
   Object.assign(next,{x:side*(1-w)*.75,y:.10+bob+.22*gust,tilt:.67-.35*gust,angle:-.16+.18*gust,scale:.40+.20*w,inflate:.06+.94*w,alpha:appear*(.3+.64*w),lines:w});
 }else{ // gesture: lateral sweep exchanges pages
   old.x=-side*1.65*w;old.angle=-.16-.42*pulse;old.inflate=1-.92*w;old.alpha=1-.85*w;old.scale=.60-.19*w;
   Object.assign(next,{x:side*1.65*(1-w),angle:-.16+.4*pulse,y:.10+bob,scale:.40+.20*w,inflate:.10+.90*w,alpha:appear*(.28+.66*w),lines:w});
 }
 out[0]=old;out[1]=next;
 return out;
}

let yaw=-0.35, pitch=-0.32, dragging=false, startX=0,startY=0,lastX=0,lastY=0, moved=false;
function rotation(p){
 const a=p.angle*.45, b=pitch+(p.tilt-.70)*.45, c=yaw;
 const ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(b),sb=Math.sin(b),cc=Math.cos(c),sc=Math.sin(c);
 return [ca*cc-sa*sb*sc,sa*cc+ca*sb*sc,-cb*sc, -sa*cb,ca*cb,sb, ca*sc+sa*sb*cc,sa*sc-ca*sb*cc,cb*cc];
}
function matrix(p){
 const r=rotation(p), sx=p.scale*Math.min(1,innerWidth/innerHeight*1.6)*innerHeight/innerWidth, sy=p.scale*Math.min(1,innerWidth/innerHeight*1.6);
 const k=.13;
 return new Float32Array([
 sx*r[0]-p.x*k*r[2],sy*r[1]-p.y*k*r[2],-.12*r[2],-k*r[2],
 sx*r[3]-p.x*k*r[5],sy*r[4]-p.y*k*r[5],-.12*r[5],-k*r[5],
 sx*r[6]-p.x*k*r[8],sy*r[7]-p.y*k*r[8],-.12*r[8],-k*r[8],
 p.x,p.y,0,1]);
}
function draw(p,time,index){
  gl.uniformMatrix4fv(U.m,false,matrix(p));
  const r=rotation(p); gl.uniform3f(U.eye,7*r[2],7*r[5],7*r[8]);
  gl.uniform1f(U.inflate,p.inflate);
  gl.uniform1f(U.t,time*0.001+index*0.21);
  const interactive=(stage>=2 && stage<=4 && index===activeIndex()) ? press : 0;
  gl.uniform1f(U.press,interactive);
  gl.uniform2f(U.hit,hit[0],hit[1]);
  gl.uniform1f(U.alphaBias,p.alpha);
  gl.uniform1f(U.lineMix,p.lines); gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,books[stage===4?Math.min(3,transitionKind+index):0]);gl.uniform1i(U.book,0);
  gl.uniform1f(U.thickness,p.thickness);
  gl.uniform1f(U.ghost,p.ghost);
  const half=idx.length/2; const frontFirst=r[8]<0; gl.drawElements(gl.TRIANGLES,half,gl.UNSIGNED_SHORT,frontFirst?0:half*2); gl.drawElements(gl.TRIANGLES,half,gl.UNSIGNED_SHORT,frontFirst?half*2:0);
}

function activeIndex(){return stage===4&&((performance.now()-stageStart)/1000-Math.min(2,Math.floor((performance.now()-stageStart)/3500))*3.5)>1.45?1:0;}
function pageCoords(clientX,clientY){
  const p=pages[activeIndex()];
  const dx=clientX-activeRect.x, dy=clientY-activeRect.y;
  const ca=Math.cos(-p.angle), sa=Math.sin(-p.angle);
  const rx=(dx*ca-dy*sa)/(activeRect.w*0.52);
  const ry=(dx*sa+dy*ca)/(activeRect.h*0.52);
  return [Math.max(-.94,Math.min(.94,rx)),Math.max(-.94,Math.min(.94,ry)),Math.abs(rx)<=1 && Math.abs(ry)<=1];
}
canvas.addEventListener('pointerdown',e=>{
 startX=lastX=e.clientX;startY=lastY=e.clientY;moved=false;dragging=true;
 const [x,y,inside]=pageCoords(e.clientX,e.clientY);
 if(inside&&stage>=2&&stage<=4){pointerDown=true;pressTarget=1;hit=[x,-y];}
 canvas.setPointerCapture(e.pointerId);canvas.style.cursor='grabbing';
});
canvas.addEventListener('pointermove',e=>{
 if(dragging){if(Math.hypot(e.clientX-startX,e.clientY-startY)>7)moved=true;
 if(moved){pressTarget=0;pointerDown=false;yaw+=(e.clientX-lastX)*.009;pitch+=(e.clientY-lastY)*.009;}
 lastX=e.clientX;lastY=e.clientY;
 }else canvas.style.cursor='grab';
});
function release(){dragging=false;pointerDown=false;pressTarget=0;canvas.style.cursor='grab';}
canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('lostpointercapture',release);
addEventListener('keydown',e=>{if(e.repeat)return;if(e.code==='Space'&&document.activeElement?.tagName!=='BUTTON'){e.preventDefault();selectStage(4);}if(e.key==='ArrowRight'){e.preventDefault();selectStage(4);}if(e.key==='Escape')selectStage(5);});
canvas.addEventListener('dblclick',()=>{yaw=-.35;pitch=-.32;});
function render(time){
  const targets=targetPages(time);
  if(stage===4 && previousCycle!==transitionKind){[pages[0],pages[1]]=[pages[1],pages[0]];previousCycle=transitionKind;}
  for(let i=0;i<pages.length;i++){
    const p=pages[i], t=targets[i];
    p.x=lerp(p.x,t.x,0.09); p.y=lerp(p.y,t.y,0.09); p.angle=lerp(p.angle,t.angle,0.09); p.tilt=lerp(p.tilt,t.tilt,0.09);
    p.scale=lerp(p.scale,t.scale,0.09); p.inflate=lerp(p.inflate,t.inflate,0.09); p.alpha=lerp(p.alpha,t.alpha,0.09);
    p.lines=lerp(p.lines,t.lines,0.09); p.thickness=lerp(p.thickness,t.thickness,0.09); p.ghost=lerp(p.ghost,t.ghost,0.09);
  }
  vel += (pressTarget-press)*0.22; vel*=0.72; press += vel;
  
  if(!pointerDown && stage!==4 && press<0.002) press=0;

  gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.depthMask(false);
  // draw back pages first, active page last for stronger front presence
  for(let i=pages.length-1;i>=0;i--) if(i!==activeIndex() && pages[i].alpha>.005) draw(pages[i],time,i);
  draw(pages[activeIndex()],time,activeIndex());
  gl.depthMask(true);

  const p=pages[activeIndex()];
  activeRect.x=innerWidth*(0.5+p.x*0.5);
  activeRect.y=innerHeight*(0.5-p.y*0.5);
  activeRect.w=p.scale*innerHeight*1.42;
  activeRect.h=p.scale*innerHeight*1.02;

  shadow.style.left=`${50+p.x*42}%`;
  shadow.style.top=`${76-p.y*16}%`;
  shadow.style.opacity=`${0.08 + p.inflate*0.18}`;
  shadow.style.transform=`translate(-50%,-50%) scale(${0.62 + p.scale*1.15})`;
  requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
</body>
</html>
