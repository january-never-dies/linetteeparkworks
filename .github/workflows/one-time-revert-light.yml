name: Roll back global light theme
on:
  push:
    paths:
      - '.github/workflows/one-time-revert-light.yml'
permissions:
  contents: write
jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove only added light theme overrides
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          start=s.index("    /* Global light editorial palette")
          end=s.index("</style>",start)
          block=s[start:end]
          assert "--portfolio-dark: #FAFAF8" in block
          assert "Keep photographic thumbnails, artwork, phone screens and 3D objects unchanged." in block
          assert s.count("Global light editorial palette")==1
          updated=s[:start]+s[end:]
          assert 'class="about-contact"><a href="mailto:linetteepark@gmail.com">' in updated
          p.write_text(updated,encoding="utf-8")
          PY
      - name: Commit rollback and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-revert-light.yml
          git add index.html
          git commit -m "Revert global light theme while preserving About cleanup"
          git push
