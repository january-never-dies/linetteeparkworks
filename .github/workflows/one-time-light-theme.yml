name: Apply light portfolio theme
on:
  push:
    paths:
      - '.github/workflows/one-time-light-theme.yml'
permissions:
  contents: write
jobs:
  recolor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply global editorial light theme
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          assert '<template id="about-detail">' in s and '</style>' in s
          theme = """
              /* Global light editorial palette — surfaces and text, not artwork */
              :root { --portfolio-dark: #FAFAF8; --portfolio-ink: #171717; --portfolio-muted: #686868; color-scheme: light; }
              body, .expanded-panel, .detail-section.about, .detail-section.works, .detail-section.taste,
              .scene-about, .scene-works, .scene-taste, .entry-backdrop, .entry-screen {
                background: #FAFAF8; color: #171717;
              }
              .detail-section, .scene, .entry-screen, .expanded-panel .book-flip,
              .project-back, .project-next, .project-detail-back { color: #171717; }
              .site-header, body.is-open .site-header, body.works-entering .site-header {
                background: #FAFAF8; color: #171717;
              }
              .menu-toggle span, body.is-open .menu-toggle span, body.works-entering .menu-toggle span {
                background: #171717;
              }
              body.is-open .nav { background: #FAFAF8; border-color: #D7D7D3; }
              .close::before, .close::after { background: #171717; }
              .landing-intro p, .works .work-info > p, .works .story-step p,
              .works .decision-copy p, .works .reference-thumbnail .thumbnail-description,
              .works .thumbnail-description, .works .reference-thumbnail .thumbnail-date,
              .works .work-meta, .works .story-step h4, .works .detail-kicker,
              .works-navigation-hint, .thumbnail-role, .thumbnail-result,
              .works .thumbnail-result, .works .work-info > .project-back,
              .additional-label, .project-hero figcaption, .supporting-process summary,
              .plush-game-screens figcaption, .plush-gallery figcaption,
              .twc-gallery figcaption, .worldcone-gallery figcaption,
              .taste-poster figcaption, .decision-number, .decision-change span,
              .works .decision-copy .decision-note {
                color: #686868;
              }
              .works .reference-thumbnail .thumbnail-title, .works .work-result,
              .works .reference-overview, .project-next, .project-back,
              .project-detail-back { color: #171717; }
              .works .reference-thumbnail .thumbnail-tag,
              .thumbnail-kind { background: #ECECE8; color: #303030; border-color: #D8D8D2; }
              .work-result, .work-detail, .story-step, .works .work-card,
              .additional-projects, .supporting-process, .plush-process,
              .twc-process, .melt-problem, .about-info-block {
                border-color: #DADAD5;
              }
              .detail-rule { background: #DADAD5; }
              .decision-change { border-left-color: #C8C8C2; }
              .taste-graphic { border-color: #464646; }
              /* Keep photographic thumbnails, artwork, phone screens and 3D objects unchanged. */
          """
          assert 'Global light editorial palette' not in s
          s=s.replace('</style>',theme+'\n</style>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit theme and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-light-theme.yml
          git add index.html
          git commit -m "Apply off-white and charcoal theme across portfolio"
          git push
