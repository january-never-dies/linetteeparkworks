name: One-time About cleanup
on:
  push:
    paths:
      - '.github/workflows/one-time-about-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Remove extra About information only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          start = s.index('<template id="about-detail">')
          end = s.index('</template>', start) + len('</template>')
          about = s[start:end]
          contact_start = about.index('<div class="about-contact">')
          email_start = about.index('<a href="mailto:linetteepark@gmail.com">', contact_start)
          email_end = about.index('</a>', email_start) + len('</a>')
          email = about[email_start:email_end]
          assert 'Born in Arizona' in about and '<h3>Education</h3>' in about
          cleaned = about[:contact_start] + '<div class="about-contact">' + email + '</div></section></template>'
          assert '<h2>Linettee Park</h2>' in cleaned and cleaned.count('class="about-intro"') == 2
          p.write_text(s[:start] + cleaned + s[end:], encoding="utf-8")
          PY
      - name: Commit About cleanup and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-about-cleanup.yml
          git add index.html
          git commit -m "Simplify About to name, introduction and email"
          git push
