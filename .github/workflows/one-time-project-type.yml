name: Refine project card typography
on:
  push:
    paths:
      - '.github/workflows/one-time-project-type.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adjust project titles, descriptions and tags
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          changes={
            'margin:20px 0 10px;padding:0;font-size:clamp(24px,2vw,36px);font-weight:400': 'margin:20px 0 6px;padding:0;font-size:clamp(24px,2vw,36px);font-weight:400',
            'font-size:16px;font-weight:300;letter-spacing:0;line-height:1.6;color:#b9b9bd': 'font-size:16px;font-weight:400;letter-spacing:0;line-height:1.6;color:#b9b9bd',
            '.thumbnail-tags { display:flex;flex-wrap:wrap;gap:6px;margin-top:16px; }': '.thumbnail-tags { display:flex;flex-wrap:wrap;gap:6px;margin-top:8px; }',
            'color:#ececef;font-size:13px;font-weight:600;line-height:1.25': 'color:#ececef;font-size:13px;font-weight:400;line-height:1.25'
          }
          for old,new in changes.items():
            assert s.count(old)==1,(old,s.count(old))
            s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-project-type.yml
          git add index.html
          git commit -m "Refine project card text hierarchy and spacing"
          git push
